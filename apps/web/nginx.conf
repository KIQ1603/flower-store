upstream florea_api { server api:3000; keepalive 16; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;

  gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;


  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # API: chuyển tiếp, truyền IP thật của khách để giới hạn tần suất đúng người
  location /api/ {
    proxy_pass http://florea_api;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Tệp build có hash trong tên → cache 1 năm; ảnh/biểu tượng tĩnh cache 30 ngày
  location /assets/ {
    include /etc/nginx/snippets/security.conf;
    expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404;
  }
  location /images/ {
    include /etc/nginx/snippets/security.conf;
    expires 30d; add_header Cache-Control "public"; try_files $uri =404;
  }
  # index.html không cache để bản mới có hiệu lực ngay
  location / {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache"; try_files $uri /index.html;
  }
}

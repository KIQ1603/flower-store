<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg" cx="50%" cy="40%" r="72%">
        <stop offset="0%" stop-color="#e6ede0" />
        <stop offset="62%" stop-color="#c8d6be" />
        <stop offset="100%" stop-color="#5d7056" stop-opacity="0.65" />
      </radialGradient>
      <radialGradient id="sun" cx="24%" cy="16%" r="58%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="wrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="45%" stop-color="#f6ece0" />
        <stop offset="100%" stop-color="#c8d6be" />
      </linearGradient>
      <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d99b91" />
        <stop offset="60%" stop-color="#b56e64" />
        <stop offset="100%" stop-color="#7a3e36" />
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#261d17" flood-opacity="0.25" />
      </filter>
      <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#36231b" flood-opacity="0.18" />
      </filter>
    </defs>

    <rect width="800" height="1000" fill="url(#bg)" />
    <rect width="800" height="1000" fill="url(#sun)" />

    <!-- Studio 3D Arch Backdrop -->
    <path d="M115 1000 V350 A285 285 0 0 1 685 350 V1000 Z" fill="#ffffff" fill-opacity="0.18" />
    <path d="M145 1000 V365 A255 255 0 0 1 655 365 V1000 Z" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />

    
      <g filter="url(#softShadow)">
        <circle cx="400" cy="490" r="340" fill="#faf5ec" stroke="#98a88e" stroke-width="4" />
        <path d="M160 660 C110 560 130 430 210 380 C240 470 220 580 160 660 Z" fill="#cad8c0" />
        <path d="M640 640 C690 540 670 410 590 360 C560 450 580 560 640 640 Z" fill="#cad8c0" />
        <!-- Connected Neck -->
        <rect x="355" y="490" width="90" height="130" rx="20" fill="#fce8d8" stroke="#3e4a3b" stroke-width="6" />
        <!-- Connected Shoulders, Sleeves & Apron -->
        <path d="M190 840 C205 680 290 595 400 595 C510 595 595 680 610 840 Z" fill="#fffaf2" stroke="#3e4a3b" stroke-width="6" />
        <path d="M280 620 H520 L545 840 H255 Z" fill="#8fa684" stroke="#3e4a3b" stroke-width="6" />
        <rect x="350" y="690" width="100" height="75" rx="14" fill="#dce6d3" stroke="#3e4a3b" stroke-width="4" />
        <!-- Head -->
        <ellipse cx="400" cy="365" rx="165" ry="155" fill="#fce8d8" stroke="#3e4a3b" stroke-width="6" />
        <!-- Hair -->
        <path d="M235 370 C220 220 295 160 400 160 C505 160 580 220 565 375 C540 330 500 310 455 315 C420 335 360 335 330 315 C285 310 255 330 235 370 Z" fill="#463a33" stroke="#3e4a3b" stroke-width="6" />
        <!-- Smiling Eyes -->
        <path d="M325 375 C335 358 358 358 368 375" fill="none" stroke="#3e4a3b" stroke-width="8" stroke-linecap="round" />
        <path d="M432 375 C442 358 465 358 475 375" fill="none" stroke="#3e4a3b" stroke-width="8" stroke-linecap="round" />
        <ellipse cx="305" cy="405" rx="24" ry="12" fill="#e89b93" opacity="0.75" />
        <ellipse cx="495" cy="405" rx="24" ry="12" fill="#e89b93" opacity="0.75" />
        <path d="M372 415 C386 432 414 432 428 415" fill="none" stroke="#3e4a3b" stroke-width="7" stroke-linecap="round" />
        <!-- Hair flower -->
        <circle cx="515" cy="275" r="32" fill="#fffdf9" stroke="#3e4a3b" stroke-width="5" />
        <circle cx="515" cy="275" r="14" fill="#cca86e" />
      </g>
    
  </svg>
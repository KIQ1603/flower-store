# Môi trường dev: PostgreSQL + MinIO (giả lập S3/R2 để tải ảnh)
# Chọn cổng ít bị trùng: Postgres 5441, MinIO 9100 (API) / 9101 (console)
services:
  db:
    image: postgres:16-alpine
    container_name: florea-db
    environment:
      POSTGRES_USER: florea
      POSTGRES_PASSWORD: florea
      POSTGRES_DB: florea
    ports: ["5441:5432"]
    volumes: [florea-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florea"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: florea-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: florea
      MINIO_ROOT_PASSWORD: florea-secret
    ports: ["9100:9000", "9101:9001"]
    volumes: [florea-minio:/data]
  mailpit:
    image: axllent/mailpit:latest
    container_name: florea-mailpit
    ports: ["1026:1025", "8026:8025"]   # SMTP 1026 · hộp thư xem OTP: http://localhost:8026
volumes:
  florea-db:
  florea-minio:
